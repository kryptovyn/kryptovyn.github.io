const GKEYS = ['all', 'smash', 'arcade', 'puzzle', 'shooter', 'action', 'defense']
const TAGS = { new: 'NEW', up: 'UPDATE', hot: 'HOT' }
let lang = 'ko', genre = 'all', slide = 0, timer
const guess = () => { const n = (navigator.language || 'en').slice(0, 2); return LANGS[n] ? n : 'en' }
try { lang = localStorage.getItem('kv_lang') || guess() } catch { lang = guess() }
if (!LANGS[lang]) lang = 'en'
const U = () => UI[lang]
const txt = (g) => g[lang] || (X[lang] && X[lang][g.id] ? [X[lang][g.id][0], X[lang][g.id][1] || X[lang][g.id][0]] : g.en)
const gname = (k) => U().g[GKEYS.indexOf(k)]
const href = (g) => g.path || `https://playgama.ai/play/${g.url}`
function render() {
  document.documentElement.lang = lang
  document.getElementById('langName').textContent = LANGS[lang]
  document.getElementById('popTitle').textContent = U().lang
  document.getElementById('langs').innerHTML = Object.entries(LANGS).map(([k, v]) => `<button data-l="${k}" class="${k === lang ? 'on' : ''}" lang="${k}">${v}</button>`).join('')
  document.querySelectorAll('#langs button').forEach((b) => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('kv_lang', lang) } catch {} closePop(); render() })
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = U()[e.dataset.t] })
  const heroes = G.filter((g) => g.hero)
  document.getElementById('hero').innerHTML = heroes.map((g, i) => `<a class="slide${i === slide ? ' on' : ''}" href="${href(g)}" target="_blank" rel="noopener">
    <img src="img/${g.id}_hero.webp" alt="${g.name}" ${i ? 'loading="lazy"' : ''}><div class="shade"></div>
    <div class="txt">${g.tag ? `<span class="tag ${g.tag}">${TAGS[g.tag]}</span>` : ''}<h2>${txt(g)[0]}</h2><p>${g.name} · ${txt(g)[1]}</p><span class="play">▶ ${U().play}</span></div></a>`).join('')
    + `<div class="dots">${heroes.map((_, i) => `<button aria-label="${i + 1}" class="${i === slide ? 'on' : ''}" data-i="${i}"></button>`).join('')}</div>`
  document.querySelectorAll('.dots button').forEach((b) => b.onclick = (e) => { e.preventDefault(); slide = +b.dataset.i; render(); restart() })
  document.getElementById('chips').innerHTML = GKEYS.map((k) => `<button class="chip${k === genre ? ' on' : ''}" data-g="${k}">${gname(k)}</button>`).join('')
  document.querySelectorAll('.chip').forEach((b) => b.onclick = () => { genre = b.dataset.g; render() })
  document.getElementById('grid').innerHTML = G.filter((g) => genre === 'all' || g.g === genre).map((g) => `<a class="card" href="${href(g)}" target="_blank" rel="noopener">
    <div class="thumb"><img src="img/${g.id}.webp" alt="${g.name}" loading="lazy" width="640" height="360">${g.tag ? `<span class="tag ${g.tag}">${TAGS[g.tag]}</span>` : ''}<div class="go"><span>▶ ${U().play}</span></div></div>
    <div class="info"><b>${g.name}</b><p>${txt(g)[0]}</p><span class="genre">${gname(g.g)}</span><span class="dev">PC · Mobile</span></div></a>`).join('')
}
function restart() { clearInterval(timer); timer = setInterval(() => { slide = (slide + 1) % G.filter((g) => g.hero).length; document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('on', i === slide)); document.querySelectorAll('.dots button').forEach((b, i) => b.classList.toggle('on', i === slide)) }, 5000) }
const pop = document.getElementById('pop')
function closePop() { pop.classList.remove('on') }
document.getElementById('langBtn').onclick = () => pop.classList.add('on')
pop.onclick = (e) => { if (e.target === pop) closePop() }
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop() })
render(); restart()
</script>
