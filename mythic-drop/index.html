<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
        <title>Mythic Drop</title>
        <style>
            html, body, #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: white;
                background-color: black;
                overflow: hidden;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }

            #canvas {
                display: block;
            }

            #canvas:focus {
                outline: none;
            }

            #status, #status-splash, #status-progress {
                position: absolute;
                left: 0;
                right: 0;
            }

            #status, #status-splash {
                top: 0;
                bottom: 0;
            }

            #status {
                background-color: #07080d;
                transition: opacity 0.3s linear;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9000;
            }

            /* The loading film (tools/loading_film.js) fills the screen, cut to fit either way round. */
            #loading-film {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Upright the whole width would show only a sliver of the film: a band in the upper part instead,
               cut to about 60% of its width (the knight stays in it). */
            @media (orientation: portrait) {
                #loading-film {
                    top: 22vh;
                    height: 40vh;
                }
            }

            /* Behind it upright: the same film, blurred and dimmed, filling the screen (no black bands). */
            #loading-film-back {
                display: none;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: blur(14px) brightness(0.55);
                transform: scale(1.1);
            }

            @media (orientation: portrait) {
                #loading-film-back {
                    display: block;
                }
            }


            #status-notice {
                display: none;
            }

            #loader {
                position: absolute;
                left: 50%;
                bottom: max(7%, 24px);
                transform: translateX(-50%);
                box-sizing: border-box;
                width: min(88vw, 480px);
                padding: 16px 24px 18px;
                border-radius: 16px;
                background-color: rgba(16, 20, 28, 0.82);
                color: white;
                font-family: 'Noto Sans', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
                text-align: center;
            }

            #loader-percent {
                font-size: 32px;
                font-weight: 700;
                line-height: 1.2;
            }

            #loader-bar {
                position: relative;
                overflow: hidden;
                height: 18px;
                margin: 10px 0 12px;
                border-radius: 9px;
                background-color: rgba(255, 255, 255, 0.18);
            }

            /* Drawn by scaling (the compositor's work): it keeps moving while the engine holds the page's one thread. */
            #loader-fill {
                height: 100%;
                width: 100%;
                border-radius: 9px;
                background-color: #fcdb2b;
                transform: scaleX(0);
                transform-origin: left center;
                transition: transform 0.2s linear;
                will-change: transform;
            }

            /* The download fills 0-80%, the engine's start the rest: the bar never stands still (2026-11-08,
               a bar stopped at 100% for 10 s on a phone looked broken). */
            #loader.starting #loader-fill {
                transition: none;
                animation: loader-start 14s cubic-bezier(0.1, 0.6, 0.3, 1) forwards;
            }

            @keyframes loader-start {
                from { transform: scaleX(0.8); }
                to { transform: scaleX(0.98); }
            }

            #loader.starting #loader-percent {
                visibility: hidden;
            }

            /* Runs on the compositor, so it keeps moving while the engine holds the page's one thread. */
            #loader-shine {
                display: none;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 35%;
                background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
                will-change: transform;
                animation: loader-shine 1.1s linear infinite;
            }

            #loader.starting #loader-shine {
                display: block;
            }

            @keyframes loader-shine {
                from { transform: translateX(-100%); }
                to { transform: translateX(290%); }
            }

            #loader-text {
                font-size: 22px;
                line-height: 1.3;
            }

            #status-notice {
                background-color: #5b3943;
                border-radius: 0.5rem;
                border: 1px solid #9b3943;
                color: #e0e0e0;
                font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
                line-height: 1.3;
                margin: 0 2rem;
                overflow: hidden;
                padding: 1rem;
                text-align: center;
                z-index: 1;
            }


            /* A low landscape screen (a phone on its side): a smaller box at the bottom, off the knight. */
            @media (orientation: landscape) and (max-height: 500px) {
                #loader {
                    bottom: 8px;
                    width: min(60vw, 420px);
                    padding: 8px 18px 10px;
                }
                #loader-percent {
                    font-size: 24px;
                }
                #loader-bar {
                    height: 14px;
                    margin: 6px 0 8px;
                }
            }

            /* After the download, while the engine starts and holds the page's one thread (the film stops then):
               scenes of the game, crossfading and slowly drawing closer, one every 4 s. Opacity and transform
               only, the compositor's work, so they keep moving (2026-11-08 사용자 "로딩되는 동안 ... 심심하지 않게"). */
            #loading-carousel {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                opacity: 0;
                transition: opacity 0.5s linear;
            }

            #status.starting #loading-carousel {
                opacity: 1;
            }

            #loading-film, #loading-film-back {
                transition: opacity 0.5s linear;
            }

            #status.starting #loading-film, #status.starting #loading-film-back {
                opacity: 0;
            }

            .slide {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                opacity: 0;
                will-change: opacity, transform;
            }

            .slide img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .slide figcaption {
                position: absolute;
                left: 0;
                right: 0;
                top: 9%;
                text-align: center;
                color: white;
                font-family: 'Noto Sans', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
                font-size: 24px;
                font-weight: 700;
                text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 2px black;
            }

            #status.starting .slide {
                animation: slide 24s linear infinite;
                animation-delay: calc(var(--i) * 4s);
            }

            #status.starting .slide:first-child {
                opacity: 1;
            }

            @keyframes slide {
                0% { opacity: 0; transform: scale(1); }
                2.08% { opacity: 1; }
                16.67% { opacity: 1; }
                18.75% { opacity: 0; transform: scale(1.08); }
                100% { opacity: 0; transform: scale(1.08); }
            }
        </style>

                <figure class="slide" style="--i: 0"><img src="loading_0_map0.webp" alt=""><figcaption data-ko="이끼 아래 길이 묻힌 들판" data-en="Fields where moss buried the roads"></figcaption></figure>
                <figure class="slide" style="--i: 1"><img src="loading_1_map1.webp" alt=""><figcaption data-ko="해골들이 대신 지키던 무덤가" data-en="The graveyard the skeletons kept"></figcaption></figure>
                <figure class="slide" style="--i: 2"><img src="loading_2_legend.webp" alt=""><figcaption data-ko="잠결에 탄 땅" data-en="Ground burned in a sleep"></figcaption></figure>

                <figure class="slide" style="--i: 4"><img src="loading_4_boss.webp" alt=""><figcaption data-ko="" data-en=""></figcaption></figure>

            <div id="loader">
                <div id="loader-percent">0%</div>

        <script>
            // The page's own loading screen; Bridge's logo is turned off in playgama-bridge-config.json.
            const LOADER_TEXT = {
                en: { loading: 'Loading…', starting: 'Starting…' },
                ko: { loading: '불러오는 중…', starting: '시작하는 중…' },
            }
            // If the game never says it is ready, it is shown anyway instead of being covered for good.
            const LOADER_GIVE_UP_MSEC = 30000
            let loaderLanguage = (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en'
            let loaderPercent = 0
            let loaderStarted = false

            function drawLoader() {
                const text = LOADER_TEXT[loaderLanguage]
                document.getElementById('loader-percent').textContent = `${loaderPercent}%`
                if (!loaderStarted) {
                    document.getElementById('loader-fill').style.transform = `scaleX(${loaderPercent / 100})`
                }
                document.getElementById('loader-text').textContent = loaderStarted ? text.starting : text.loading
                for (const caption of document.querySelectorAll('.slide figcaption')) {
                    caption.textContent = caption.dataset[loaderLanguage]
                }
            }

            function setLoaderLanguage(language) {
                loaderLanguage = language === 'ko' ? 'ko' : 'en'
                drawLoader()
            }

            function setLoaderProgress(current, total) {
                // The carousel and the bar's second part go on at 90% of the download, while the page still has
                // its thread: a CSS animation starts only when the page next lays itself out, and the engine
                // takes the thread the moment the download ends (at 98% they started only after the engine had,
                // 2026-11-08). The engine's own last call, at 100%, comes after the game has started.
                const done = total > 0 && current / total >= 0.9
                if (!document.getElementById('status') || !total) {
                    return
                }
                loaderPercent = done ? 80 : Math.max(loaderPercent, Math.floor(current * 80 / total))
                filmUntil = done ? FILM_STAND : 1.8 + (FILM_WAKE - 1.8) * current / total
                if (done && !loaderStarted) {
                    loaderStarted = true
                    document.getElementById('loader').classList.add('starting')
                    document.getElementById('status').classList.add('starting')
                }
                if (!loaderStarted || done) {
                    drawLoader()
                }
            }

            // The loading film: its clock runs with the download (the moss falls off the knight as the files
            // arrive, his waking when they are in), at 30 frames a second, never ahead of the download.
            // While the engine starts it holds the page's one thread, so the film waits on a frame then.
            const FILM_WAKE = 15.5
            const FILM_STAND = 18.0
            let filmClock = 0
            let filmUntil = 1.8
            let filmLast = 0
            let filmOn = true
            const filmBack = document.getElementById('loading-film-back')
            const filmBackPen = filmBack.getContext('2d')
            function filmFrame(now) {
                if (!filmOn) {
                    return
                }
                requestAnimationFrame(filmFrame)
                if (now - filmLast < 33 || !window.loadingFilm) {
                    return
                }
                const step = filmLast ? Math.min(0.1, (now - filmLast) / 1000) : 0
                filmLast = now
                // Behind the download by more than two seconds of film: catch up three times as fast.
                filmClock = Math.min(filmUntil, filmClock + step * (filmUntil - filmClock > 2 ? 3 : 1))
                window.loadingFilm.draw(filmClock)
                // Upright, the blurred copy behind (a small canvas: the blur hides the detail anyway).
                if (filmBack.offsetParent !== null) {
                    filmBackPen.drawImage(document.getElementById('loading-film'), 0, 0, filmBack.width, filmBack.height)
                }
            }
            requestAnimationFrame(filmFrame)

            // The game calls this with its first scene on screen (scripts/autoload/playgama.gd).
            window.hideLoader = function () {
                window.hideLoader = function () {}
                const status = document.getElementById('status')
                status.style.opacity = '0'
                setTimeout(function () {
                    filmOn = false
                    status.remove()
                }, 300)
            }

            drawLoader()
        </script>
        <script>
// Goes into the Playgama page ahead of index.js (tools/export_web.py). The engine's two big files start
// downloading here, while the Bridge SDK is still loading, and the engine's own requests take them.
// The server there does not compress, so index.wasm comes from index.wasm.gz, unpacked on the way in. The first
// bytes decide: gzip is unpacked, a wasm (the server already unpacked it) is used as it is, anything else or a
// browser without DecompressionStream (Safari before 16.4) takes index.wasm. The engine counts the unpacked
// bytes, so its progress still matches fileSizes.
(function () {
	var plain = window.fetch;
	if (!plain) {
		return;
	}
	function unpack(url) {
		return plain.call(window, url + '.gz').then(function (response) {
			if (!response.ok || !response.body) {
				throw new Error('no ' + url + '.gz');
			}
			var reader = response.body.getReader();
			return reader.read().then(function (first) {
				var head = first.value;
				var gzip = head && head[0] === 0x1f && head[1] === 0x8b;
				var wasm = head && head[0] === 0x00 && head[1] === 0x61 && head[2] === 0x73 && head[3] === 0x6d;
				if (!gzip && !wasm) {
					reader.cancel();
					throw new Error('not a wasm: ' + url + '.gz');
				}
				var body = new ReadableStream({
					start: function (controller) {
						controller.enqueue(head);
					},
					pull: function (controller) {
						return reader.read().then(function (next) {
							if (next.done) {
								controller.close();
							} else {
								controller.enqueue(next.value);
							}
						});
					},
					cancel: function (reason) {
						return reader.cancel(reason);
					},
				});
				if (gzip) {
					body = body.pipeThrough(new DecompressionStream('gzip'));
				}
				return new Response(body, { headers: { 'Content-Type': 'application/wasm' } });
			});
		});
	}
	function wasmFile() {
		if (typeof DecompressionStream === 'undefined') {
			return plain.call(window, 'index.wasm');
		}
		return unpack('index.wasm').catch(function () {
			return plain.call(window, 'index.wasm');
		});
	}
	var early = { 'index.wasm': wasmFile(), 'index.pck': plain.call(window, 'index.pck') };
	window.fetch = function (input) {
		var waiting = early[input];
		if (waiting) {
			// Once: the engine asks again only to retry a failed download.
			delete early[input];
			return waiting;
		}
		if (input === 'index.wasm') {
			return wasmFile();
		}
		return plain.apply(window, arguments);
	};
	early['index.wasm'].catch(function () {});
	early['index.pck'].catch(function () {});
})();
</script>
<script>
// The Playgama page's loading picture: "The Knight Wakes" (gamedev-kit/story/knight-wakes, drawn by code), the
// knight a forest grew on while he slept waking up: the world's prologue (WORLD.md: the heroes wake from the
// long sleep). Copied from there with its own canvas, half the pixels and less film grain, and no loop of its
// own: tools/playgama_shell.html drives it (window.loadingFilm.draw(t)) at 30 fps while the files arrive and
// stops it when the game is ready. Change the film there and copy again.
(function () {

// A giant knight, asleep so long a forest grew on him, wakes at sunrise and launches into the sky.
// Everything is drawn in code. The world is laid out in metres and seen through a pinhole camera, so trees,
// grass and mist shrink toward the horizon and slide past each other when the camera moves. Fog thickens
// with distance. The knight and birds move on twos (12 drawings a second) with a slightly boiling ink line.
const C = document.getElementById('loading-film'), X = C.getContext('2d')
const W = 960, H = 402, S = 1, LENGTH = 25
const U = 0.16 // metres per knight drawing unit (helmet top about 22 m kneeling, 52 m to the plume standing)
const KZ = 240 // where the knight kneels
let seed = 7
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const r = (a, b) => a + rand() * (b - a)
const pick = (a) => a[Math.floor(rand() * a.length)]
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const ease = (t) => t * t * (3 - 2 * t)
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1)
const mix = (a, b, t) => a + (b - a) * t
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]
const mixc = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s) }
function keys(t, ks) { if (t <= ks[0][0]) return ks[0][1]; for (let i = 0; i < ks.length - 1; i++) { const [a, va] = ks[i], [b, vb] = ks[i + 1]; if (t <= b) return mix(va, vb, ease((t - a) / (b - a))) } return ks[ks.length - 1][1] }
function cnv(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return [c, c.getContext('2d')] }

// ---------------------------------------------------------------- painted pieces, made once
function blobPts(x, y, rx, ry, n = 14, j = 0.16) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + r(-j, j); p.push([x + Math.cos(a) * rx * k, y + Math.sin(a) * ry * k]) } return p }
function pathPts(g, p, dx = 0, dy = 0) {
  const n = p.length, m = (a, b) => [(a[0] + b[0]) / 2 + dx, (a[1] + b[1]) / 2 + dy]
  g.beginPath(); const s = m(p[n - 1], p[0]); g.moveTo(s[0], s[1])
  for (let i = 0; i < n; i++) { const a = p[i], e = m(a, p[(i + 1) % n]); g.quadraticCurveTo(a[0] + dx, a[1] + dy, e[0], e[1]) }
  g.closePath()
}
const RIM = '#ffd08a'
// rim light that respects overlap: erase what the new shape covers, then add its lit crescent (sun is to the right)
function rimShape(gr, gt, pts, rx, ry, box) {
  gt.clearRect(box[0], box[1], box[2], box[3])
  pathPts(gt, pts); gt.fillStyle = RIM; gt.fill()
  gt.globalCompositeOperation = 'destination-out'; pathPts(gt, pts, -rx * 0.16, ry * 0.2); gt.fill(); gt.globalCompositeOperation = 'source-over'
  gr.globalCompositeOperation = 'destination-out'; pathPts(gr, pts); gr.fill(); gr.globalCompositeOperation = 'source-over'
  gr.drawImage(gt.canvas, box[0], box[1], box[2], box[3], box[0], box[1], box[2], box[3])
}
const FOGC = '#a7b5c8'
function silhouette(src, color) { const [c, g] = cnv(src.width, src.height); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height); return c }

const TH = 900
function makeBroad(sd) {
  seed = sd
  const w = 620, h = TH, cx = w / 2, by = h - 10
  const [base, gb] = cnv(w, h), [rim, gr] = cnv(w, h), [, gt] = cnv(w, h)
  const crownY = h * r(0.28, 0.36), lean = r(-20, 20)
  // trunk with root flare
  gb.fillStyle = '#2e2522'
  gb.beginPath(); gb.moveTo(cx - 46, by); gb.quadraticCurveTo(cx - 16, by - 60, cx - 13 + lean * 0.5, by - 200); gb.lineTo(cx - 8 + lean, crownY + 60); gb.lineTo(cx + 8 + lean, crownY + 60); gb.lineTo(cx + 15 + lean * 0.5, by - 200); gb.quadraticCurveTo(cx + 18, by - 60, cx + 50, by); gb.closePath(); gb.fill()
  gr.strokeStyle = RIM; gr.lineWidth = 5; gr.beginPath(); gr.moveTo(cx + 46, by); gr.quadraticCurveTo(cx + 16, by - 60, cx + 13 + lean * 0.5, by - 200); gr.lineTo(cx + 7 + lean, crownY + 60); gr.stroke()
  gb.strokeStyle = '#2e2522'
  for (let i = 0; i < 6; i++) { const y0 = crownY + r(40, 160), s = i % 2 ? 1 : -1; gb.lineWidth = r(5, 10); gb.beginPath(); gb.moveTo(cx + lean, y0); gb.quadraticCurveTo(cx + s * r(40, 90), y0 - r(30, 60), cx + s * r(90, 200), y0 - r(60, 160)); gb.stroke() }
  // crown: clumps, lower ones darker
  const clumps = []
  for (let i = 0; i < 34; i++) { const a = r(0, Math.PI * 2), d = Math.sqrt(rand()); clumps.push({ x: cx + lean + Math.cos(a) * d * w * 0.36, y: crownY + Math.sin(a) * d * h * 0.21, rx: r(48, 92) }) }
  clumps.sort((a, b) => a.y - b.y)
  for (const c of clumps) {
    const ry = c.rx * r(0.62, 0.8), pts = blobPts(c.x, c.y, c.rx, ry, 16, 0.14)
    const low = clamp((c.y - (crownY - h * 0.2)) / (h * 0.42), 0, 1)
    pathPts(gb, pts); gb.fillStyle = rgb(mixc(hex('#3c5a40'), hex('#1b2c22'), low)); gb.fill()
    for (let k = 0; k < 6; k++) { pathPts(gb, blobPts(c.x + r(-c.rx * 0.5, c.rx * 0.6), c.y - r(0, ry * 0.6), c.rx * r(0.18, 0.32), ry * r(0.14, 0.26), 9, 0.25)); gb.fillStyle = rgb(mixc(hex('#4d6d4d'), hex('#2a4130'), low), 0.8); gb.fill() }
    rimShape(gr, gt, pts, c.rx, ry, [c.x - c.rx * 1.3, c.y - ry * 1.3, c.rx * 2.6, ry * 2.6])
  }
  return { base, rim, fog: silhouette(base, FOGC), aspect: w / h }
}
function makePine(sd) {
  seed = sd
  const w = 440, h = TH, cx = w / 2, by = h - 10
  const [base, gb] = cnv(w, h), [rim, gr] = cnv(w, h), [, gt] = cnv(w, h)
  gb.fillStyle = '#2b2321'; gb.beginPath(); gb.moveTo(cx - 22, by); gb.lineTo(cx - 5, h * 0.05); gb.lineTo(cx + 5, h * 0.05); gb.lineTo(cx + 24, by); gb.fill()

  { a: 12.6, b: 17.4, k0: { x: -15, y: 1.8, z: 166, f: 520, hy: 0.95, ex: 1 }, k1: { x: -13, y: 2.4, z: 162, f: 520, hy: 1.0, ex: 1 } },

function flight(t) { const s = Math.max(0, t - 18.4); return { x: 2.6 * s * s * s, y: 20 * s * s + 22 * s, z: KZ + 40 * s * s } }
function camAt(t) {
  let sh = SHOTS[0]; for (const s of SHOTS) if (t >= s.a) sh = s
  const k = ease(seg(t, sh.a, sh.b)), c = {}
  for (const n in sh.k0) c[n] = mix(sh.k0[n], sh.k1[n], k)
  c.hy *= H; c.shot = SHOTS.indexOf(sh)

                    }).then(() => {
                        CANVAS.focus()
                        setTimeout(() => window.hideLoader(), LOADER_GIVE_UP_MSEC)
                    });
                })
            }
        </script>

    </body>
</html>
