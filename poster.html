<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRYPTOVYN Video Poster</title>
<style>
:root{--bg:#15102b;--card:#211a40;--line:#3a3166;--text:#f2eefc;--dim:#b8b0d8;--accent:#fe2c55;--ok:#2ee6a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 60px}h1{margin:0 0 4px;font-size:26px}p.sub{margin:0 0 22px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}button.ghost{background:#2f2758}
.who{display:flex;align-items:center;gap:12px}.who img{width:44px;height:44px;border-radius:50%;background:#333}
label{display:block;margin:14px 0 6px;color:var(--dim);font-size:13px}
textarea,select,input[type=file]{width:100%;background:#120d26;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:80px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row label{display:flex;align-items:center;gap:8px;margin:6px 14px 0 0;color:var(--text)}
video{width:100%;max-height:420px;border-radius:10px;background:#000;margin-top:10px}.note{color:var(--dim);font-size:13px}
.status{margin-top:12px;font-weight:700}.ok{color:var(--ok)}.bad{color:#ff8a8a}a{color:#ff9bea}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>KRYPTOVYN Video Poster</h1>
  <p class="sub">Post gameplay shorts of KRYPTOVYN's own web games to the KRYPTOVYN TikTok account.</p>

  <section class="card" id="signin">
    <div id="who" class="who"><span id="whoText">Not signed in</span></div>
    <p class="note" id="helper"></p>
    <button id="login">Sign in with TikTok</button>
  </section>

  <section class="card" id="compose">
    <label for="file">Video (MP4)</label>
    <input type="file" id="file" accept="video/mp4">
    <video id="preview" controls hidden></video>
    <label for="caption">Caption</label>
    <textarea id="caption" maxlength="2200" placeholder="Caption and #hashtags"></textarea>
    <label for="privacy">Who can view this video</label>
    <select id="privacy"><option value="" selected disabled>Select privacy</option></select>
    <label>Allow users to</label>
    <div class="row">
      <label><input type="checkbox" id="comment"> Comment</label>
      <label><input type="checkbox" id="duet"> Duet</label>
      <label><input type="checkbox" id="stitch"> Stitch</label>
    </div>
    <label>Content disclosure</label>
    <div class="row"><label><input type="checkbox" id="disclose"> This video promotes a brand, product or service</label></div>
    <div class="row" id="discloseOpts" hidden>
      <label><input type="checkbox" id="brand"> Your brand</label>
      <label><input type="checkbox" id="branded"> Branded content</label>
    </div>
    <p class="note" id="consent">By posting, you agree to TikTok's <a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>.</p>
    <button id="post" disabled>Post to TikTok</button>
    <div class="status" id="status"></div>
  </section>
  <p class="note"><a href="/terms.html">Terms of Service</a> · <a href="/privacy.html">Privacy Policy</a> · <a href="/">KRYPTOVYN games</a></p>
</main>
<script>
// The UI runs here on kryptovyn.github.io; a helper on this computer (tiktok_api.py serve, 127.0.0.1:8765)
// keeps the app secret and the sign-in token and does the upload.
const H = 'http://127.0.0.1:8765', $ = (id) => document.getElementById(id)
const NAMES = { PUBLIC_TO_EVERYONE: 'Everyone', MUTUAL_FOLLOW_FRIENDS: 'Friends', FOLLOWER_OF_CREATOR: 'Followers', SELF_ONLY: 'Only me' }
let creator = null
async function api(path, opt) { const r = await fetch(H + path, opt); return r.json() }
function ready() { $('post').disabled = !(creator && creator.signed_in && $('file').files[0] && $('privacy').value && (!$('disclose').checked || $('brand').checked || $('branded').checked)) }
async function loadCreator() {
  try { creator = await api('/creator') } catch { $('helper').textContent = 'Start the helper on this computer: python -I tiktok_api.py serve'; return }
  $('helper').textContent = ''
  if (!creator.signed_in) return
  $('who').innerHTML = (creator.avatar ? `<img src="${creator.avatar}" alt="">` : '') + `<div><b>${creator.nickname || ''}</b><div class="note">@${creator.username || ''} · posting as this account</div></div>`
  $('login').textContent = 'Switch account'
  const sel = $('privacy'); sel.length = 1
  for (const p of creator.privacy) { const o = document.createElement('option'); o.value = p; o.textContent = NAMES[p] || p; sel.appendChild(o) }
  $('comment').disabled = !!creator.comment_off; $('duet').disabled = !!creator.duet_off; $('stitch').disabled = !!creator.stitch_off
  ready()
}
$('login').onclick = async () => { const r = await api('/login_url'); location.href = r.url }
$('file').onchange = () => { const f = $('file').files[0]; if (f) { $('preview').src = URL.createObjectURL(f); $('preview').hidden = false } ready() }
for (const id of ['privacy', 'brand', 'branded']) $(id).onchange = () => {
  $('consent').innerHTML = $('branded').checked && $('disclose').checked
    ? 'By posting, you agree to TikTok\'s <a href="https://www.tiktok.com/legal/page/global/bc-policy/en" target="_blank" rel="noopener">Branded Content Policy</a> and <a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>.'
    : 'By posting, you agree to TikTok\'s <a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>.'
  if ($('branded').checked && $('privacy').value === 'SELF_ONLY') { $('status').className = 'status bad'; $('status').textContent = 'Branded content cannot be private (Only me).' }
  ready()
}
$('disclose').onchange = () => { $('discloseOpts').hidden = !$('disclose').checked; ready() }
$('post').onclick = async () => {
  const f = $('file').files[0]; $('post').disabled = true
  $('status').className = 'status'; $('status').textContent = 'Uploading...'
  const r = await api('/post', { method: 'POST', body: await f.arrayBuffer(), headers: { 'Content-Type': 'video/mp4', 'X-Caption': encodeURIComponent($('caption').value), 'X-Privacy': $('privacy').value,
    'X-Comment': $('comment').checked ? '1' : '0', 'X-Duet': $('duet').checked ? '1' : '0', 'X-Stitch': $('stitch').checked ? '1' : '0',
    'X-Brand': $('disclose').checked && $('brand').checked ? '1' : '0', 'X-Branded': $('disclose').checked && $('branded').checked ? '1' : '0' } })
  if (!r.publish_id) { $('status').className = 'status bad'; $('status').textContent = 'Failed: ' + (r.error || ''); ready(); return }
  $('status').textContent = 'Uploaded. TikTok is processing the video; it can take a few minutes to appear on the profile.'
  for (let i = 0; i < 60; i++) {
    await new Promise((d) => setTimeout(d, 4000))
    const s = await api('/status?id=' + encodeURIComponent(r.publish_id))
    if (s.status === 'PUBLISH_COMPLETE') { $('status').className = 'status ok'; $('status').textContent = 'Posted to TikTok.'; break }
    if (s.status === 'FAILED') { $('status').className = 'status bad'; $('status').textContent = 'TikTok could not post it: ' + (s.fail || ''); break }
  }
}
// back from TikTok sign-in: hand the code to the helper
const q = new URLSearchParams(location.search)
if (q.get('code')) api(`/exchange?code=${encodeURIComponent(q.get('code'))}&state=${encodeURIComponent(q.get('state') || '')}`).then(() => { history.replaceState(null, '', '/poster.html'); loadCreator() })
else loadCreator()
</script>
</body>
</html>
